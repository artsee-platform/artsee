<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="artsee_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Artiqore 艺见心</title>
  <link rel="manifest" href="manifest.json">
  <!-- Required by Tencent's Flutter Web bridge. Versions are pinned to the
       JavaScript runtime used by tencent_cloud_chat_sdk 8.7.7201+3. -->
  <script src="node_modules/tim-upload-plugin/index.js"></script>
  <script src="node_modules/@tencentcloud/chat/index.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #F8F9FA; }
    input, textarea, .flt-text-editing {
      outline: none !important;
      border: none !important;
      box-shadow: none !important;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // DDC 模式下手动触发 main()，兼容非 Chrome-CDP 打开（如手动访问 localhost:3004）
    // 通过 _flutter.didCreateEngineInitializer 拦截，确保只触发一次
    (function() {
      var orig = window._flutter;
      window._flutter = window._flutter || {};
      window._flutter.didCreateEngineInitializer = function(initializeEngine) {
        if (window.__artseeEngineStarted) return;
        window.__artseeEngineStarted = true;
        initializeEngine().then(function(engine) {
          engine.runApp();
        });
      };
    })();
  </script>
</body>
</html>
